version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: file-upload-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: file_upload

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management

    container_name: rabbitmq

    restart: always

    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: